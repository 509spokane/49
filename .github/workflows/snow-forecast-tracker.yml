name: Snow Forecast Tracker

on:
  schedule:
    # Every 3 hours; the 13:17 UTC run (~6 AM Pacific) takes the daily forecast snapshot.
    - cron: '17 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Snapshot forecasts and mountain report
        run: python3 .github/scripts/snowtrack.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add snowtrack/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Snow forecast tracker $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
